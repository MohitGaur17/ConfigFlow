services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: configflow_db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: configflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d configflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies the checked-in Prisma schema without deleting persistent database data.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-init
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/configflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: configflow_server
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/configflow
      # Local-demo default only. Set a unique JWT_SECRET for deployment.
      JWT_SECRET: ${JWT_SECRET:-configflow-local-demo-secret-not-for-production-change-me}
      PORT: 4000
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: npm run start --workspace=server

  # Frontend Client
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: configflow_client
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    name: configflow_network
